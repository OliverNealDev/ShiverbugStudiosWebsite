name: Build and validate

# The team pages, index grids, llms.txt and sitemap are all generated from
# data/team.json. This job regenerates them and fails if the committed output
# doesn't match, so the site can never drift from its source of truth.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap lastmod comes from each file's last commit date, so the build
          # needs real history. The default shallow clone would date every page
          # to the tip commit and the drift check below would fire every run.
          fetch-depth: 0

      - name: Regenerate team pages, llms.txt and sitemap
        shell: powershell
        run: .\tools\build-team.ps1

      # The press archives are generated too, and rebuilding without changing an
      # input is byte-identical, so they fall under the same drift check below.
      # Swapping a logo and forgetting the rebuild used to ship a press kit that
      # disagreed with the site; now it fails here instead.
      - name: Regenerate the press bundles
        shell: powershell
        run: .\tools\build-press-kit.ps1

      - name: Fail if generated files are out of date
        shell: bash
        run: |
          # git diff only sees tracked files, so a brand-new generated file would
          # slip through uncommitted and 404 in production. Check for those first.
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            echo "::error::The build produced files that were never committed:"
            echo "$untracked"
            exit 1
          fi
          # sitemap lastmod is each file's last commit date. Committing an edit
          # moves that date, so the value generated here can legitimately differ
          # from the one committed alongside the edit. A date-only change is
          # expected; everything else must match.
          if ! git diff --quiet -- . ':(exclude)sitemap.xml'; then
            echo "::error::Generated files are out of date. Run tools/build-team.ps1 and commit the result."
            git --no-pager diff --stat -- . ':(exclude)sitemap.xml'
            git --no-pager diff -- . ':(exclude)sitemap.xml'
            exit 1
          fi
          if ! git diff --quiet -- sitemap.xml; then
            changed=$(git --no-pager diff -U0 -- sitemap.xml | grep -c '^[+-][^+-]' || true)
            dates=$(git --no-pager diff -U0 -- sitemap.xml | grep -c '^[+-].*<lastmod>' || true)
            if [ "$changed" -ne "$dates" ]; then
              echo "::error::sitemap.xml is out of date beyond its lastmod dates."
              git --no-pager diff -- sitemap.xml
              exit 1
            fi
            echo "sitemap.xml differs only by lastmod dates - fine."
          fi
          echo "Generated files are up to date."

      - name: Validate the site
        shell: powershell
        run: .\tools\validate-site.ps1
