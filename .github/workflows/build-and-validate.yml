name: Build and validate

# The team pages, index grids, llms.txt and sitemap are all generated from
# data/team.json. This job regenerates them and fails if the committed output
# doesn't match, so the site can never drift from its source of truth.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sitemap lastmod comes from each file's last commit date, so the build
          # needs real history. The default shallow clone would date every page
          # to the tip commit and the drift check below would fire every run.
          fetch-depth: 0

      - name: Regenerate team pages, llms.txt and sitemap
        shell: powershell
        run: .\tools\build-team.ps1

      # The press archives are generated too, and rebuilding without changing an
      # input is byte-identical, so they fall under the same drift check below.
      # Swapping a logo and forgetting the rebuild used to ship a press kit that
      # disagreed with the site; now it fails here instead.
      - name: Regenerate the press bundles
        shell: powershell
        run: .\tools\build-press-kit.ps1

      - name: Fail if generated files are out of date
        shell: bash
        run: |
          # git diff only sees tracked files, so a brand-new generated file would
          # slip through uncommitted and 404 in production. Check for those first.
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            echo "::error::The build produced files that were never committed:"
            echo "$untracked"
            exit 1
          fi
          # Both date stamps come from LastCommitDate, which is `git log -1` on the
          # file itself. So the value baked into a file is always computed before
          # the commit that writes it, and the commit that writes it moves the
          # date again. The two only agree when a commit lands on the same day as
          # the previous commit to touch that file - true within a day's work,
          # false the moment a change crosses midnight. This check used to allow
          # that for sitemap.xml alone, but the same helper stamps dateModified
          # into every page's JSON-LD, and those were compared strictly. Six days
          # passed between two commits and all 20 generated pages went red at
          # once, on a drift the build is designed to produce.
          #
          # So: a diff of nothing but date stamps is expected and fine. Anything
          # else means the generated output genuinely disagrees with team.json.
          if ! git diff --quiet; then
            changed=$(git --no-pager diff -U0 | grep -c '^[+-][^+-]' || true)
            dates=$(git --no-pager diff -U0 | grep -cE '^[+-].*(<lastmod>|"dateModified")' || true)
            if [ "$changed" -ne "$dates" ]; then
              echo "::error::Generated files are out of date. Run tools/build-team.ps1 and commit the result."
              git --no-pager diff --stat
              git --no-pager diff
              exit 1
            fi
            echo "Generated files differ only by lastmod / dateModified stamps - expected."
          fi
          echo "Generated files are up to date."

      - name: Validate the site
        shell: powershell
        run: .\tools\validate-site.ps1
